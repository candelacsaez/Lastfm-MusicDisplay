services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      LASTFM_API_KEY: ${LASTFM_API_KEY:?Missing LASTFM_API_KEY. Copy .env.example to .env and fill it in}
      LASTFM_USER: ${LASTFM_USER:?Missing LASTFM_USER. Copy .env.example to .env and fill it in}
      PORT: "3000"
    restart: unless-stopped
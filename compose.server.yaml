services:
  web:
    ports: !reset []
    restart: unless-stopped
    networks:
      default:
      web-net:
        aliases:
          - shelf-web
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
      web-net:

volumes:
  caddy-data:
  caddy-config:

networks:
  web-net:
    external: true
